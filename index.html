<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loren Mannoia: Home</title>

    <link rel="icon" type="image/png" href="icon.png">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
</head>
<body>

<nav class="container-fluid">
    <div class="nav-wrapper"> 
        <ul>
            <li>
                <a href="index.html" class="nav-logo">
                    <img src="icon.png" alt="Logo" style="height: 40px; width: auto;">
                </a>
            </li>
        </ul>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Loren</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </div>
</nav>

<main class="container">
    <!-- HERO SECTION WITH VERTICAL DNA & TYPING EFFECT -->
    <section class="hero-terminal">
        <div class="hero-left">
            <div class="dna-wrapper-vertical">
                <!-- Strand 1 -->
                <div class="dna-dot" style="--i:1; --d:0s"></div>
                <div class="dna-dot" style="--i:2; --d:0.2s"></div>
                <div class="dna-dot" style="--i:3; --d:0.4s"></div>
                <div class="dna-dot" style="--i:4; --d:0.6s"></div>
                <div class="dna-dot" style="--i:5; --d:0.8s"></div>
                <div class="dna-dot" style="--i:6; --d:1.0s"></div>
                
                <!-- Strand 2 -->
                <div class="dna-dot second-strand" style="--i:1; --d:0s"></div>
                <div class="dna-dot second-strand" style="--i:2; --d:0.2s"></div>
                <div class="dna-dot second-strand" style="--i:3; --d:0.4s"></div>
                <div class="dna-dot second-strand" style="--i:4; --d:0.6s"></div>
                <div class="dna-dot second-strand" style="--i:5; --d:0.8s"></div>
                <div class="dna-dot second-strand" style="--i:6; --d:1.0s"></div>
            </div>
        </div>

        <div class="hero-right">
            <h1><span id="typed-name"></span><span class="cursor">|</span></h1>
            <p class="hero-subtitle">Deliberation • Science • Technology</p>
            
            <div class="hero-actions">
                <a href="contact.html" role="button" class="contact-btn glow-violet">Get in Touch</a>
                <button id="game-mode-btn" class="contact-btn glow-pink">🎮 Play Game</button>
            </div>
        </div>
    </section>

    <!-- FLOATING GAME OVERLAY CONTAINER -->
    <div id="game-modal" class="game-modal hidden">
        <div class="game-box">
            <button id="close-game" class="close-btn">&times;</button>
            <h3>DNA Sequence Catcher 🧬</h3>
            <p>Catch the glowing nucleotides before time runs out!</p>
            <div class="game-stats">
                <span>Score: <strong id="game-score">0</strong></span>
                <span>Time: <strong id="game-timer">15</strong>s</span>
            </div>
            <div id="game-canvas"></div>
            <button id="start-game-btn" class="contact-btn glow-violet">Start Sequence</button>
        </div>
    </div>

    <!-- REST OF YOUR PROJECTS SECTION CONTINUES HERE -->

<footer id="contact" class="container">
    <div class="footer-content">
        <hr>
        <p><small>© 2026 Andrea Loren Mannoia • <a href="https://github.com/andrea-loren" target="_blank">GitHub</a> • <a href="https://linkedin.com/in/andrea-m-189483354" target="_blank">LinkedIn</a> • 
            <a href="https://instagram.com/_andrea_loren" target="_blank">Instagram</a></small></p>
    </div>
</footer>

</body>
</html>
